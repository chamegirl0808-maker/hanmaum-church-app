<script src="board.js"></script><script>
(function(){var B=window.BOARD||{},k=B.current,M=B.months&&B.months[k];
function e(x){return String(x).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
if(!M){board.innerHTML="<p>게시판 내용이 아직 없습니다.</p>";return}
bt.textContent=M.title;document.title=M.title+" · 한마음제자교회";
var h="";(M.sections||[]).forEach(function(s){h+='<div class="card bd" style="margin-bottom:14px"><h3>'+e(s.title)+'</h3><ol>'+s.items.map(function(r){return'<li><b>'+e(r[0])+'</b><span>'+e(r[1])+'</span></li>'}).join("")+'</ol>'+(s.note?'<p class="note">'+e(s.note)+'</p>':'')+'</div>'});
board.innerHTML=h;})();
</script></body></html>
