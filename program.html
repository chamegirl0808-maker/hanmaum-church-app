<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>사역 안내 · 한마음제자교회</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700;900&display=swap"><link rel="stylesheet" href="style.css"><script src="photos.js"></script><script src="programs.js"></script></head><body><header class="top"><a class="brand" href="index.html"><img data-photo="logo" alt=""><span class="bt"><b>한마음제자교회</b><small>HANMAEUM DISCIPLE CHURCH</small></span></a></header>
<main id="pg"></main>
<nav class="tab"><a href="index.html"><span>🏠</span>홈</a><a href="index.html#about"><span>⛪</span>교회소개</a><a href="ministry.html" class="on"><span>🤝</span>사역</a><a href="jubo.html"><span>📖</span>주보</a><a href="index.html#more"><span>☰</span>더보기</a></nav>
<script>
const id=new URLSearchParams(location.search).get("id"),p=PROGRAMS[id],el=document.getElementById("pg");
if(!p){el.innerHTML='<section><p>사역을 찾을 수 없습니다.</p><a class="back" href="ministry.html">← 사역 목록으로</a></section>';}
else{const m=MINISTRIES[p.ministry];document.title=p.title+" · 한마음제자교회";
el.innerHTML=`<div class="phero" style="background-image:url('${p.photos[0]}')"></div><section class="pdet">

<div class="card"><p>${p.desc}</p>${p.note?`<p class="pnote">📌 ${p.note}</p>`:""}</div>
<div class="pverse card"><b>관련 말씀</b><span>${m.verse}</span></div>
<div class="gal">${p.photos.slice(1).map(s=>`<img src="${s}" alt="">`).join("")}</div>
<a class="back big" href="ministry.html#${p.ministry}">← 사역 목록으로 돌아가기</a></section>`;}
</script></body></html>
